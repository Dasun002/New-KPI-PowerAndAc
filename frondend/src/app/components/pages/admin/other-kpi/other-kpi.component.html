<!-- Renders CRUD controls and the table for general Other KPI definitions. -->
<div class="page-container">
  <div class="page-header">
    <h1>{{ pageTitle }}</h1>
  </div>

  <div class="dashboard-container">
    <div class="form-container">
      <div class="form-header">
        <div>
          <h2>{{ editingId ? 'Update KPI' : 'Add New KPI' }}</h2>
          <p class="form-sub">Manage Network Engineer KPI records</p>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-submit" form="other-kpi-form" [disabled]="form.invalid || saving">
            {{ editingId ? 'Update' : 'Add' }}
          </button>
          <button type="button" class="btn-cancel" *ngIf="editingId" (click)="onCancelEdit()"
            [disabled]="saving">Cancel</button>
        </div>
      </div>

      <form id="other-kpi-form" class="kpi-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group">
            <label>Network Engineer KPI</label>
            <input type="text" formControlName="networkEngineerKpi" placeholder="Network Engineer KPI" required />
          </div>

          <div class="form-group">
            <label>Category</label>
            <input type="text" formControlName="division" placeholder="Category" />
          </div>

          <div class="form-group">
            <label>Target</label>
            <input type="text" formControlName="section" placeholder="Target" />
          </div>

          <div class="form-group">
            <label>Weightage (%)</label>
            <input type="number" formControlName="kpiPercent" placeholder="Weightage (%)" />
          </div>
        </div>
      </form>
    </div>

    <div class="table-wrapper">
      <div class="table-responsive">
        <table class="kpi-table">
          <thead>
            <tr>
              <th>Network Engineers KPI</th>
              <th>Category</th>
              <th>Target</th>
              <th>Weightage (%)</th>
              <th class="actions-col">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="records.length===0">
              <td colspan="5" class="no-data">No KPI data available</td>
            </tr>

            <tr *ngFor="let record of records">
              <td>{{ record.networkEngineerKpi }}</td>
              <td>{{ record.division }}</td>
              <td>{{ record.section }}</td>
              <td>{{ record.kpiPercent }}</td>
              <td class="actions-col">
                <div class="action-buttons">
                  <button type="button" class="btn-edit" (click)="onEdit(record)">Edit</button>
                  <button type="button" class="btn-delete" (click)="onDelete(record.id)">Delete</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
